:root{--green:#17634e;--ink:#183c32;--muted:#6b7c74;--bg:#f5f7f2;--line:#dde5da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 20px;min-height:48px;background:#eaf0e6;color:var(--ink)}button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible{outline:3px solid #b48232;outline-offset:3px}.primary{background:var(--green);color:white}.ghost{background:white;border:1px solid var(--line)}.small{font-size:15px;padding:8px 14px;min-height:40px}header{background:white;border-bottom:1px solid var(--line);padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:24px;font-weight:bold;display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:white;border-radius:14px;width:44px;height:44px;display:grid;place-items:center}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:13px;letter-spacing:2px}.roles{display:flex;background:#eef2eb;padding:5px;border-radius:14px}.roles button{background:transparent;min-height:42px;padding:8px 18px;font-size:16px}.roles .active{background:white;box-shadow:0 2px 7px #173c3210}.shell{max-width:1400px;margin:auto;display:grid;grid-template-columns:230px 1fr;gap:36px;padding:32px 4%}aside nav{display:grid;gap:10px}nav button{text-align:left;background:transparent;color:var(--muted)}nav button.active{background:#e0ecdf;color:var(--green);font-weight:bold}.profile{margin:0 0 24px;padding:20px;background:white;border:1px solid var(--line);border-radius:18px}.avatar{background:#e5edda;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px}.profile strong{display:block;margin-top:10px}.aside-note{font-size:14px;margin-top:30px;color:var(--muted)}.eyebrow{font-size:14px;letter-spacing:2px;color:var(--green);font-weight:bold}h1{font-size:32px;margin:6px 0}h2{font-size:23px;margin:0 0 16px}h3{margin:0;font-size:23px}p{margin:8px 0}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0}.stat{padding:18px 22px;background:white;border-radius:16px;border:1px solid var(--line)}.stat b{font-size:30px;margin-right:8px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:16px}.hero{background:#e9f0e0;border-color:#d8e4cf;padding:28px}.hero h3{font-size:30px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{width:54px;height:54px;flex-shrink:0;border-radius:16px;background:#eaf0e2;display:grid;place-items:center;color:var(--green);font-size:28px}.med-title{display:flex;align-items:center;gap:16px}.badge{font-size:14px;padding:5px 10px;border-radius:8px;background:#edf1e9;white-space:nowrap}.done{color:#17634e;background:#e5f1e9}.warn{color:#956116;background:#fff0d5}.timeline{font-size:14px;color:var(--muted);margin:8px 0}.notice{border-left:3px solid #bb914b;padding:12px 16px;background:#fff8e9;font-size:15px;border-radius:8px}.progress{height:8px;border-radius:8px;background:#e7eddf;margin:16px 0;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.demo{max-width:1400px;margin:0 auto;padding:16px 4% 32px;font-size:14px;color:var(--muted)}.demo-inner{border-top:1px dashed #c9d3c2;padding-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}dialog{border:1px solid var(--line);border-radius:22px;padding:28px;width:min(600px,92vw);max-height:90vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#14352866}label{display:block;margin:14px 0 6px;font-size:16px}input,select{width:100%;padding:11px;border:1px solid #c8d4c5;border-radius:9px;background:white;color:var(--ink)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.close{float:right}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:14px 25px;border-radius:12px;z-index:10;display:none}.empty{padding:30px;text-align:center;color:var(--muted)}body.large{font-size:22px}body.large h3{font-size:27px}body.contrast{--ink:#08291c;--muted:#354a3b;--line:#7e9683;--green:#06452e}.setting{padding:20px 0;border-bottom:1px solid var(--line)}footer{font-size:13px;margin-top:20px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.shell{gap:22px;grid-template-columns:180px 1fr}}@media(max-width:700px){header{flex-wrap:wrap;padding:16px}.shell{display:block;padding:20px 16px}aside .profile,aside .aside-note{display:none}aside nav{display:flex;overflow:auto;margin-bottom:24px}nav button{white-space:nowrap;padding:10px 14px}.heading{align-items:flex-start}h1{font-size:26px}.stats{gap:8px}.stat{padding:12px;font-size:14px}.stat b{font-size:24px}.row{flex-wrap:wrap}.card{padding:18px}.fields{grid-template-columns:1fr}.brand{font-size:21px}}

html{height:100%}body{min-height:100dvh;background:#edf0ed;display:grid;place-items:center;padding:22px 16px;font-size:17px}
.phone{position:relative;width:min(430px,100%);height:min(900px,calc(100dvh - 44px));min-height:320px;background:var(--bg);border:8px solid #23342e;border-radius:42px;box-shadow:0 22px 65px #183c3220;overflow:hidden;isolation:isolate}
.phone-status{height:32px;padding:5px 20px 0;background:white;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:bold;position:relative}.camera{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:52px;height:15px;border-radius:12px;background:#23342e}

header{padding:16px;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:#ffffffed;backdrop-filter:blur(10px)}.brand{font-size:21px;gap:10px}.logo{width:38px;height:38px;border-radius:12px}.subtitle{font-size:10px;letter-spacing:1px}.roles{margin-left:auto;padding:3px}.roles button{font-size:14px;min-height:36px;padding:6px 10px}header>span{display:none}
.shell{display:block;max-width:none;margin:0;padding:22px 16px 8px}.profile,.aside-note{display:none}aside nav{position:absolute;bottom:0;left:0;right:0;height:80px;z-index:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:0;padding:8px 6px 17px;background:white;border-top:1px solid var(--line);overflow:visible}nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;white-space:nowrap;padding:4px 2px;min-height:48px;border-radius:10px;font-size:12px}nav button .nav-icon{font-size:23px;line-height:1.2}nav button.active{background:#edf4e9}
.heading{display:block;margin-bottom:18px}.heading>button{margin-top:12px;width:100%}.eyebrow{font-size:12px;letter-spacing:1px}h1{font-size:25px;line-height:1.4}h2{font-size:21px}h3{font-size:21px}.heading p{font-size:15px}.stats{gap:8px;margin:16px 0}.stat{padding:13px 8px;text-align:center;font-size:13px}.stat b{display:block;font-size:27px;margin:0}.layout{display:block}.card{padding:18px;border-radius:18px}.hero{padding:20px}.hero h3{font-size:25px;line-height:1.5}.row{flex-wrap:wrap;gap:10px}.med-title{gap:12px;min-width:0}.med-title>div{min-width:0}.med-title h3{overflow-wrap:anywhere}.pill{width:44px;height:44px;border-radius:13px}.actions{gap:8px}.actions button{font-size:15px;flex:1;padding:12px 10px}.actions button.small{flex:0 1 auto}.badge{font-size:13px}.fields{grid-template-columns:1fr}.demo{margin:0;padding:12px 16px 24px;max-width:none;font-size:12px}.demo-inner{gap:8px;padding-top:14px}.demo-inner strong{width:100%}.demo .small{font-size:12px;padding:8px;min-height:36px;flex:1}.demo-inner>span{display:block;width:100%}.notice{font-size:14px}
dialog{width:min(390px,calc(100vw - 64px));max-height:calc(100dvh - 140px);padding:22px;border-radius:20px}dialog::backdrop{background:transparent}.phone:has(dialog[open])::after{content:'';position:absolute;inset:0;background:#14352877;z-index:4;pointer-events:none}.toast{max-width:360px;width:calc(100vw - 90px);text-align:center;font-size:15px;bottom:calc(max(22px,(100dvh - 900px)/2) + 94px)}body.large{font-size:21px}body.large h1{font-size:29px}body.large h3{font-size:25px}
@media(max-width:480px){body{padding:8px}.phone{height:calc(100dvh - 16px);border-width:5px;border-radius:30px;width:100%}.phone-scroll{height:calc(100% - 108px)}.phone-status{height:28px}.shell{padding:18px 14px 8px}.roles button{font-size:13px;padding:6px 8px}header{padding:14px;gap:8px}.brand{font-size:19px}.toast{bottom:100px}}

.medicine-fields{display:grid;grid-template-columns:1.15fr 1fr;gap:10px}.medicine-fields>div{min-width:0}.medicine-fields input{min-width:0;padding:10px 8px;font-size:16px}.time-picker-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}.time-picker-row input{min-width:0;flex:1}.time-picker-row button{flex:none}
.pending-group{padding:18px 18px 8px}.group-heading{padding-bottom:14px;border-bottom:1px solid var(--line)}.group-heading h2{margin:0;font-size:28px;letter-spacing:1px}.group-medicine{padding:18px 0;border-bottom:1px solid var(--line)}.group-medicine:last-child{border-bottom:0}.group-medicine h3{font-size:20px}.group-medicine p{font-size:16px}.group-medicine .actions button{font-size:14px;padding:10px 8px}.pending-group .med-title{align-items:flex-start}
.group-actions{padding:12px 0 10px;display:grid;grid-template-columns:1fr 1fr}.group-actions .primary{grid-column:1 / -1}.pending-group .group-medicine{padding:16px 0}.group-actions button{min-height:48px}

<body>
<div class="phone" aria-label="手机屏幕预览">
<div class="phone-status"><span>9:41</span><span class="camera" aria-hidden="true"></span><span aria-label="网络和电量">▂▄▆ · Wi-Fi · ▰</span></div>
<div class="phone-scroll">
<header><div class="brand"><span class="logo">✚</span><div>安心用药<div class="subtitle">让每一次照顾，都有回应</div></div></div><div class="roles" aria-label="演示角色"><button id="elder-role" class="active" onclick="setRole('elder')">老人端</button><button id="relative-role" onclick="setRole('relative')">亲属端</button></div><span class="muted" style="font-size:14px">● 本地交互原型</span></header>
<div class="shell"><aside><div class="profile"><div class="avatar" id="avatar">陈</div><strong id="profile-name">陈阿姨</strong><span class="muted" id="profile-caption">今天也要好好照顾自己</span></div><nav id="nav"></nav><div class="aside-note">本原型保存到当前浏览器。<br>线上数据库与跨设备同步将在开发阶段接入。</div></aside><main id="main"></main></div>

</div>
<dialog id="editor"><button class="small close ghost" onclick="closeDialog('editor')">关闭</button><h2 id="form-title">添加用药计划</h2><p class="muted">核对清楚后，再加入每日安排。</p><form id="plan-form"><label>录入方式</label><select id="source" onchange="sourceChanged()"><option value="manual">手动填写</option><option value="prescription">处方图片 · 模拟识别</option><option value="leaflet">说明书图片 · 模拟识别</option></select><div id="upload-area" hidden><label>上传图片（仅本地预览）</label><input type="file" id="file" accept="image/*"><img id="image-preview" alt="上传的原图" style="max-width:100%;max-height:180px;margin-top:12px" hidden><button type="button" class="small ghost" onclick="mockOCR()">填入演示识别结果</button><p class="notice">这是模拟识别，不会读取图片文字。说明书不会自动填写个人用量。</p></div><div class="medicine-fields"><div><label for="name">药品名称</label><input id="name" required maxlength="80" placeholder="输入药品名称" oninput="matchMedicine()"></div><div><label for="category">药品类型</label><input id="category" required list="category-options" placeholder="如：降压药"><datalist id="category-options"><option>降压药</option><option>降糖药</option><option>感冒药</option><option>降脂药</option><option>解热镇痛药</option><option>抗过敏药</option><option>其他</option></datalist></div></div><p id="match-hint" class="muted" style="font-size:13px">输入完整药名后自动匹配，也可以手动填写类型。</p><label for="dosage">每次用量及单位</label><input id="dosage" required placeholder="例如：1 片、0.5 片、5 毫升" oninput="updateCourse()"><label>每日提醒时间</label><div id="time-pickers"></div><button type="button" class="ghost small" onclick="addTimePicker()">＋ 添加提醒时间</button><label for="start">开始日期</label><input id="start" type="date" required oninput="updateCourse()"><label for="course-mode">疗程（长期用药可不填）</label><select id="course-mode" onchange="courseModeChanged()"><option value="days">持续天数</option><option value="quantity">药品数量</option></select><label id="course-label" for="course-value">持续天数</label><input id="course-value" type="number" min="1" step="1" placeholder="留空表示长期用药" oninput="updateCourse()"><p id="course-summary" class="notice" aria-live="polite"></p><label for="note">用法备注</label><input id="note" maxlength="150" placeholder="填写已确认的医嘱"><label style="display:flex;gap:10px;align-items:flex-start"><input id="reviewed" type="checkbox" required style="width:22px;height:22px">我已核对药名、类型、用量和提醒时间</label><p id="form-error" role="alert" style="color:#a13e30"></p><button class="primary" type="submit">核对并保存计划</button></form></dialog>
<dialog id="reminder"><button class="small close ghost" onclick="closeDialog('reminder')">关闭</button><div class="eyebrow">用药提醒</div><div id="reminder-content"></div></dialog>
<div id="toast" class="toast" role="status"></div>
</div>
<script>
// 内置药品分类表：仅精确匹配通用名和已列出的别名，类型可人工修改。
const MEDICINE_CATALOG=[
{name:'氨氯地平',category:'降压药',aliases:['氨氯地平片','苯磺酸氨氯地平片']},
{name:'氯沙坦',category:'降压药',aliases:['氯沙坦钾片']},
{name:'二甲双胍',category:'降糖药',aliases:['盐酸二甲双胍片','盐酸二甲双胍缓释片','二甲双胍片']},
{name:'阿托伐他汀',category:'降脂药',aliases:['阿托伐他汀钙片']},
{name:'对乙酰氨基酚',category:'解热镇痛药',aliases:['对乙酰氨基酚片']},
{name:'西替利嗪',category:'抗过敏药',aliases:['盐酸西替利嗪片']},
{name:'氯雷他定',category:'抗过敏药',aliases:['氯雷他定片']}
];
function findMedicine(name){const n=String(name).replace(/\s/g,'');return MEDICINE_CATALOG.find(m=>[m.name,...m.aliases].includes(n))}
let autoCategory='';
function matchMedicine(){const m=findMedicine($('name').value);if(m){$('category').value=m.category;autoCategory=m.category;$('match-hint').textContent='已匹配：'+m.name+' → '+m.category+'，可手动修改。'}else{if($('category').value===autoCategory)$('category').value='';autoCategory='';$('match-hint').textContent=$('name').value?'暂未匹配，请手动填写药品类型。':'输入完整药名后自动匹配，也可以手动填写类型。'}}
function getTimes(){return [...document.querySelectorAll('#time-pickers input')].map(i=>i.value)}
function addTimePicker(value=''){const row=document.createElement('div');row.className='time-picker-row';const input=document.createElement('input');input.type='time';input.required=true;input.value=typeof value==='string'?value:'';input.setAttribute('aria-label','每日提醒时间');input.addEventListener('input',updateCourse);const button=document.createElement('button');button.type='button';button.className='ghost small';button.textContent='移除';button.onclick=()=>{if(getTimes().length===1){toast('至少保留一个提醒时间');return}row.remove();updateCourse()};row.append(input,button);$('time-pickers').append(row);updateCourse()}
function courseModeChanged(){const quantity=$('course-mode').value==='quantity';$('course-label').textContent=quantity?'药品总量（单位与每次用量一致）':'持续天数';$('course-value').min=quantity?'0.01':'1';$('course-value').step=quantity?'any':'1';updateCourse()}
function calculateCourse(start,times,dosage,mode,value){if(value==='')return {end:'',totalDoses:null,summary:'长期用药：不设置结束日期。'};const n=Number(value);if(!Number.isFinite(n)||n<=0)throw Error('请输入大于 0 的疗程数值。');if(!start||!times.length||times.some(t=>!t))throw Error('请先填写开始日期和每日提醒时间。');let count,remainder=0,unit='';if(mode==='days'){if(!Number.isInteger(n))throw Error('持续天数必须是整数。');count=n*times.length}else{const match=dosage.trim().match(/^(\d+(?:\.\d+)?|\.\d+)\s*(片|粒|颗|袋|包|丸|滴|毫升|ml|mL|克|g|毫克|mg)$/);if(!match||Number(match[1])<=0)throw Error('每次用量请填写数值和单位，例如 1 片或 5 毫升。');const dose=Number(match[1]);unit=match[2];count=Math.floor(n/dose+1e-9);remainder=Math.max(0,Number((n-count*dose).toFixed(8)));if(count<1)throw Error('药品总量不足一次用量，请核对。')};if(count>100000)throw Error('计算次数过大，请核对输入。');const days=Math.ceil(count/times.length),date=new Date(start+'T00:00:00Z');date.setUTCDate(date.getUTCDate()+days-1);const end=date.toISOString().slice(0,10);return {end,totalDoses:count,summary:`预计 ${count} 次用药，${days} 天，最后一天 ${end}。`+(mode==='quantity'?`总量 ${n} ${unit}。`:'')+(remainder?`剩余 ${remainder} ${unit} 不足一次用量，不自动生成额外剂次。`:'')}}
function updateCourse(){try{$('course-summary').textContent=calculateCourse($('start').value,getTimes(),$('dosage').value,$('course-mode').value,$('course-value').value).summary}catch(e){$('course-summary').textContent=e.message}}

const KEY='care-meds-demo-v1';let role=new URLSearchParams(location.search).get('role')==='relative'?'relative':'elder',page='today',editing=null,activeReminder=null,shown=new Set(),sound=false;let toastTimer;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());const nowTime=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
function demoPlans(){return [
{id:'a',name:'降压药 A（演示）',category:'降压药',dosage:'1 片',times:['08:00']},
{id:'b',name:'降糖药 B（演示）',category:'降糖药',dosage:'1 片',times:['08:00','12:00','18:00']},
{id:'c',name:'降脂药 C（演示）',category:'降脂药',dosage:'1 片',times:['20:00']},
{id:'d',name:'胃药 D（演示）',category:'胃药',dosage:'1 袋',times:['08:00','18:00']},
{id:'e',name:'补充剂 E（演示）',category:'营养补充剂',dosage:'1 粒',times:['12:00']},
{id:'f',name:'其他药 F（演示）',category:'其他',dosage:'5 毫升',times:['20:00']}
].map(p=>({...p,start:dateKey(),end:'',note:'仅用于展示，不作为用药建议',active:true,demo:true}))}
function seed(){return {plans:demoPlans(),tasks:[],events:[],messages:[],bound:true,large:false,contrast:false,updated:new Date().toISOString(),sampleVersion:2}}
function read(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.plans)&&Array.isArray(d.tasks)&&Array.isArray(d.events)&&Array.isArray(d.messages)?d:seed()}catch{return seed()}}let db=read();
// Supplement existing demo sessions without resetting user plans or history.
if(db.sampleVersion!==2){for(const sample of demoPlans()){const existing=db.plans.find(p=>p.id===sample.id&&p.name===sample.name);if(existing){existing.category=existing.category||sample.category;existing.times=[...new Set([...existing.times,...sample.times])];}else if(!db.plans.some(p=>p.id===sample.id)){db.plans.push(sample)}}db.sampleVersion=2;save()}
function save(){db.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('浏览器存储不可用，当前更改仅保留在本页面');return false}}
function ensureTasks(){let changed=false;db.plans.filter(p=>p.active&&p.start<=dateKey()&&(!p.end||p.end>=dateKey())).forEach(p=>[...p.times].sort().forEach((t,index)=>{const dayIndex=Math.round((new Date(dateKey()+'T00:00:00+08:00')-new Date(p.start+'T00:00:00+08:00'))/86400000);if(p.totalDoses!=null&&dayIndex*p.times.length+index>=p.totalDoses)return;const id=p.id+'-'+dateKey()+'-'+t;if(!db.tasks.some(x=>x.id===id)){db.tasks.push({id,planId:p.id,date:dateKey(),time:t,name:p.name,category:p.category||'',dosage:p.dosage,note:p.note,status:'pending',snoozeUntil:0});changed=true}}));if(changed)save()}
// One-time user-requested reset; keep plans, historical days and current UI.
function resetTodayOnce(){const resetId='today-reset-20261011-01';if(db.appliedTodayReset===resetId)return;ensureTasks();const ids=new Set();db.tasks.filter(t=>t.date===dateKey()&&t.status!=='canceled').forEach(t=>{ids.add(t.id);t.status='pending';t.snoozeUntil=0;delete t.forcedOverdue;delete t.confirmTime;delete t.actor;delete t.reason});db.events=db.events.filter(e=>e.date!==dateKey());db.messages=db.messages.filter(m=>!ids.has(m.taskId));db.appliedTodayReset=resetId;shown.clear();save()}
resetTodayOnce();
function today(){return db.tasks.filter(t=>t.date===dateKey()&&t.status!=='canceled').sort((a,b)=>a.time.localeCompare(b.time))}function overdue(t){return t.status==='pending'&&(t.forcedOverdue||Date.now()>new Date(t.date+'T'+t.time+':00+08:00').getTime()+15*60000)}function status(t){return t.status==='done'?'已确认服用':t.status==='skipped'?'已跳过':overdue(t)?'超时未确认':'待确认'}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3200)}function closeDialog(id){$(id).close();if(id==='reminder')activeReminder=null}
function setRole(r){role=r;page='today';closeDialog('reminder');render();document.querySelector('.phone-scroll').scrollTop=0}
function render(){ensureTasks();document.body.classList.toggle('large',db.large);document.body.classList.toggle('contrast',db.contrast);$('elder-role').classList.toggle('active',role==='elder');$('relative-role').classList.toggle('active',role==='relative');$('avatar').textContent=role==='elder'?'陈':'林';$('profile-name').textContent=role==='elder'?'陈阿姨':'林女士 · 女儿';$('profile-caption').textContent=role==='elder'?'今天也要好好照顾自己':'关注妈妈的每一天';const links=[['today',role==='elder'?'◷  今天的用药':'◷  今日情况'],['plans','▤  药品与计划'],['history','↺  历史记录'],['family','♡  我的家人']];$('nav').innerHTML=links.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="page='${id}';render()"><span class="nav-icon" aria-hidden="true">${label.split('  ')[0]}</span><span>${label.split('  ')[1]}</span></button>`).join('');if(role==='relative'&&!db.bound&&page!=='family'&&page!=='settings'){$('main').innerHTML='<div class="card"><h1>还未绑定老人</h1><p>完成绑定后才能查看用药资料。</p><button class="primary" onclick="page=\'family\';render()">前往绑定</button></div>';return}({today:renderToday,plans:renderPlans,history:renderHistory,family:renderFamily,settings:renderSettings}[page])()}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">家庭用药助手 / ${role==='elder'?'老人端':'亲属端'}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function taskCard(t){return `<div class="card"><div class="row"><div class="med-title"><span class="pill">◒</span><div><div class="timeline">${esc(t.time)} · ${esc(t.category||'未分类')}</div><h3>${esc(t.name)}</h3><p>每次 ${esc(t.dosage)}</p></div></div><span class="badge ${t.status==='done'?'done':overdue(t)?'warn':''}">${status(t)}</span></div>${t.snoozeUntil>Date.now()?'<p class="muted">已选择稍后提醒</p>':''}<p class="muted" style="font-size:15px">${esc(t.note)}</p><div class="actions">${t.status==='pending'?(role==='elder'?`<button class="primary" onclick="act('${t.id}','done')">我已吃药</button><button class="ghost" onclick="act('${t.id}','snooze')">10 分钟后提醒</button><button class="ghost" onclick="act('${t.id}','skipped')">跳过</button>`:`<button class="primary" onclick="sendReminder('${t.id}')">提醒一下</button><button class="ghost" onclick="act('${t.id}','done')">代记已服用</button>`):`<button class="small ghost" onclick="act('${t.id}','undo')">撤销${t.status==='done'?'确认':'跳过'}</button><span class="muted" style="font-size:15px">${esc(t.actor||'')} · ${esc(t.confirmTime||'')}</span>`}</div></div>`}
function pendingGroup(){const pending=today().filter(t=>t.status==='pending');return pending.length?pending.filter(t=>t.time===pending[0].time):[]}
function groupActions(time){return role==='elder'?`<button class="primary" onclick="actGroup('${time}','done')">我已吃药</button><button class="ghost" onclick="actGroup('${time}','snooze')">稍后提醒</button><button class="ghost" onclick="actGroup('${time}','skipped')">跳过本次</button>`:`<button class="primary" onclick="remindGroup('${time}')">提醒一下</button><button class="ghost" onclick="actGroup('${time}','done')">代记已服用</button>`}
function groupContents(tasks){return tasks.map(t=>`<div class="group-medicine"><h3>${esc(t.name)}</h3><p>每次 ${esc(t.dosage)} <span class="muted">· ${esc(t.category||findMedicine(t.name)?.category||'未分类')}</span></p></div>`).join('')}
function renderToday(){const tasks=pendingGroup();$('main').innerHTML=tasks.length?`<section class="card pending-group"><div class="row group-heading"><h2>${esc(tasks[0].time)}</h2><span class="badge ${tasks.some(overdue)?'warn':''}">${tasks.some(overdue)?'超时未确认':'待确认用药'}</span></div>${groupContents(tasks)}${tasks.some(t=>t.snoozeUntil>Date.now())?'<p class="muted">已选择稍后提醒</p>':''}<div class="actions group-actions">${groupActions(tasks[0].time)}</div></section>`:'<div class="card empty">今天没有待确认的用药。</div>'}
function actGroup(time,action){const tasks=today().filter(t=>t.time===time&&t.status==='pending');if(!tasks.length)return;let reason='';if(action==='done'&&role==='relative'&&!confirm('确认代记这个时段的全部药品已服用？请先核实。'))return;const stamp=Date.now();tasks.forEach(t=>{if(action==='snooze'){t.snoozeUntil=stamp+600000}else{t.status=action;t.reason=reason;t.actor=role==='elder'?'老人确认':'亲属代记';t.confirmTime=nowTime();db.messages.filter(m=>m.taskId===t.id).forEach(m=>m.canceled=true)}db.events.unshift({id:crypto.randomUUID(),taskId:t.id,name:t.name,date:dateKey(),time:nowTime(),action,actor:role==='elder'?'陈阿姨':'林女士',reason})});save();closeDialog('reminder');render();toast(action==='snooze'?'本时段将在 10 分钟后提醒':action==='done'?'已记录本时段全部药品服用':'已跳过本时段用药')}
function remindGroup(time){const tasks=today().filter(t=>t.time===time&&t.status==='pending');if(!db.bound||!tasks.length)return;const stamp=Date.now();if(db.messages.some(m=>tasks.some(t=>t.id===m.taskId)&&stamp-m.at<60000)){toast('刚刚已经提醒过，请稍等 1 分钟');return}tasks.forEach(t=>db.messages.unshift({id:crypto.randomUUID(),taskId:t.id,text:`女儿提醒您：请确认 ${time} 的 ${t.name} 是否已经服用。`,at:stamp,read:false,canceled:false}));save();render();toast('本时段用药提醒已保存')}
function act(id,action){const t=db.tasks.find(x=>x.id===id);if(!t)return;if(action==='undo'){if(!confirm('撤销这次记录？'))return;t.status='pending';t.confirmTime='';t.actor='';shown.delete(id)}else if(action==='snooze'){if(t.status!=='pending')return;t.snoozeUntil=Date.now()+600000;toast('将在页面打开时于 10 分钟后提醒')}else{if(t.status!=='pending'){toast('这次用药已经处理');return}if(role==='relative'&&!confirm('确认代记妈妈已服用？请先核实。'))return;let reason='';t.status=action;t.reason=reason;t.actor=role==='elder'?'老人确认':'亲属代记';t.confirmTime=nowTime();db.messages.filter(m=>m.taskId===id).forEach(m=>m.canceled=true);toast(action==='done'?'已记录本次服用':'已记录跳过原因')}db.events.unshift({id:crypto.randomUUID(),taskId:id,name:t.name,date:dateKey(),time:nowTime(),action,actor:role==='elder'?'陈阿姨':'林女士',reason:t.reason||''});save();if(activeReminder===id)closeDialog('reminder');render()}
function sendReminder(id){const t=db.tasks.find(x=>x.id===id);if(!db.bound||!t||t.status!=='pending')return;const previous=db.messages.find(m=>m.taskId===id&&Date.now()-m.at<60000);if(previous){toast('刚刚已经提醒过，请稍等 1 分钟');return}db.messages.unshift({id:crypto.randomUUID(),taskId:id,text:`女儿提醒您：请确认 ${t.time} 的 ${t.name} 是否已经服用。`,at:Date.now(),read:false,canceled:false});save();toast('提醒已保存，老人页面可查看');render()}
function readMessage(id){const m=db.messages.find(x=>x.id===id);if(m)m.read=true;save();render();toast('已标记阅读，服药状态保持不变')}
function renderPlans(){$('main').innerHTML=heading('药品与用药计划','清楚的安排，让每一次用药更从容',`<button class="primary" onclick="openEditor()">＋ 添加计划</button>`)+db.plans.map(p=>`<div class="card"><div class="row"><div><h3>${esc(p.name)}</h3><p>${esc(p.category||'未分类')} · 每次 ${esc(p.dosage)}</p><p class="muted">每天 ${p.times.map(esc).join('、')} · ${esc(p.start)} 起${p.end?'，至 '+esc(p.end):' · 长期用药'}${p.totalDoses!=null?' · 共 '+p.totalDoses+' 次':''}</p></div><span class="badge">${p.active?'计划生效中':'已停用'}</span></div><p>${esc(p.note)}</p><div class="actions"><button class="ghost" onclick="openEditor('${p.id}')">编辑计划</button><button class="ghost" onclick="togglePlan('${p.id}')">${p.active?'停用计划':'重新启用'}</button></div></div>`).join('')}
function togglePlan(id){const p=db.plans.find(x=>x.id===id);if(!confirm(p.active?'停用后将取消未完成的安排，历史记录保留。':'重新启用此计划？'))return;p.active=!p.active;db.tasks.filter(t=>t.planId===id&&t.status==='pending').forEach(t=>{t.status='canceled';db.messages.filter(m=>m.taskId===t.id).forEach(m=>m.canceled=true)});if(p.active)p.id=crypto.randomUUID();save();render()}
function renderHistory(){$('main').innerHTML=heading('用药历史','每一条操作，都保留时间和来源')+`<div class="card"><label for="history-date">查看日期</label><input id="history-date" type="date" value="${dateKey()}" onchange="showHistory(this.value)"><div id="history-list"></div></div>`;showHistory(dateKey())}
function showHistory(date){const labels={done:'确认服用',skipped:'跳过',snooze:'稍后提醒',undo:'撤销记录'};$('history-list').innerHTML=db.events.filter(e=>e.date===date).map(e=>`<div class="setting"><div class="row"><strong>${esc(e.name)}</strong><span class="badge">${labels[e.action]}</span></div><p class="muted">${esc(e.time)} · ${esc(e.actor)}${e.action==='skipped'&&e.reason?' · 原因：'+esc(e.reason):''}</p></div>`).join('')||'<div class="empty">这一天暂无操作记录。</div>'}
function renderFamily(){$('main').innerHTML=heading('我的家人','一起关心，也尊重彼此的选择')+`<div class="card"><div class="row"><div><h2>${role==='elder'?'林女士 · 女儿':'陈阿姨 · 妈妈'}</h2><p class="muted">${db.bound?'演示绑定中 · 可查看记录、协助管理计划':'尚未绑定'}</p></div><span class="avatar">♡</span></div><div class="actions"><button class="ghost" onclick="toggleBinding()">${db.bound?'解除演示绑定':'模拟同意绑定'}</button></div><p class="notice">当前身份切换和绑定仅用于交互演示，不是真实登录或权限控制。</p></div>`}
function toggleBinding(){if(!confirm(db.bound?'解除绑定后亲属页面将隐藏用药资料。':'模拟老人同意亲属绑定？'))return;db.bound=!db.bound;save();render()}
function renderSettings(){$('main').innerHTML=heading('显示与提醒设置','看得清，操作更轻松')+`<div class="card"><div class="setting row"><div><h3>更大的文字</h3><p class="muted">放大页面文字</p></div><button aria-pressed="${db.large}" onclick="db.large=!db.large;save();render()">${db.large?'已开启':'开启'}</button></div><div class="setting row"><div><h3>高对比度</h3><p class="muted">加强文字与边框对比</p></div><button aria-pressed="${db.contrast}" onclick="db.contrast=!db.contrast;save();render()">${db.contrast?'已开启':'开启'}</button></div><div class="setting row"><div><h3>提示音</h3><p class="muted">本次页面开启期间生效</p></div><button onclick="sound=!sound;if(sound)beep();render()">${sound?'已开启':'开启并试听'}</button></div><p class="notice">Web 演示只在页面打开时提醒，不支持浏览器关闭后的可靠通知。</p></div>`}
function openEditor(id){editing=id||null;$('plan-form').reset();$('upload-area').hidden=true;$('image-preview').hidden=true;$('form-error').textContent='';$('match-hint').textContent='输入完整药名后自动匹配，也可以手动填写类型。';$('form-title').textContent=id?'编辑用药计划':'添加用药计划';$('start').value=dateKey();$('time-pickers').innerHTML='';if(id){const p=db.plans.find(x=>x.id===id);['name','dosage','start','note'].forEach(k=>$(k).value=p[k]);$('category').value=p.category||findMedicine(p.name)?.category||'';p.times.forEach(addTimePicker);$('course-mode').value=p.courseMode||'days';$('course-value').value=p.courseValue|| (p.end?Math.round((new Date(p.end)-new Date(p.start))/86400000)+1:'')}else addTimePicker('08:00');courseModeChanged();$('editor').showModal()}
function sourceChanged(){$('upload-area').hidden=$('source').value==='manual';$('reviewed').checked=false}
function mockOCR(){if(!$('file').files.length){toast('请先选择图片');return}$('name').value='苯磺酸氨氯地平片';matchMedicine();$('dosage').value=$('source').value==='leaflet'?'':'1 片';$('time-pickers').innerHTML='';addTimePicker($('source').value==='leaflet'?'':'08:00');$('note').value='请对照原图核对；此结果为预置演示内容';$('reviewed').checked=false;updateCourse();toast('已填入模拟结果，请核对全部字段')}
let imageURL=null;$('file').addEventListener('change',()=>{if(imageURL)URL.revokeObjectURL(imageURL);const f=$('file').files[0];if(f){imageURL=URL.createObjectURL(f);$('image-preview').src=imageURL;$('image-preview').hidden=false}});
$('plan-form').addEventListener('submit',e=>{e.preventDefault();const times=getTimes();if(!times.length||times.some(t=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))){$('form-error').textContent='请为每个提醒选择时间。';return}if(new Set(times).size!==times.length){$('form-error').textContent='提醒时间不能重复。';return}let course;try{course=calculateCourse($('start').value,times,$('dosage').value,$('course-mode').value,$('course-value').value)}catch(error){$('form-error').textContent=error.message;return}const fields=['name','category','dosage','start','note'];let p={id:crypto.randomUUID(),active:true,times:times.sort(),...course,courseMode:$('course-mode').value,courseValue:$('course-value').value};fields.forEach(k=>p[k]=$(k).value.trim());if(!p.name||!p.category||!p.dosage){$('form-error').textContent='请补齐药名、类型和每次用量。';return}if(editing){const old=db.plans.find(x=>x.id===editing);old.active=false;db.tasks.filter(t=>t.planId===editing&&t.status==='pending').forEach(t=>{t.status='canceled';db.messages.filter(m=>m.taskId===t.id).forEach(m=>m.canceled=true)})}db.plans.push(p);save();closeDialog('editor');page='plans';render();toast('计划已保存，今日安排已更新')});
function showReminder(t){const tasks=pendingGroup();if(!tasks.length||tasks[0].time!==t.time)return;activeReminder=tasks[0].id;$('reminder-content').innerHTML=`<h1>${esc(t.time)} 的用药</h1>${groupContents(tasks)}<div class="actions group-actions">${groupActions(t.time)}</div>`;if(!$('reminder').open)$('reminder').showModal();if(sound)beep()}
function beep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);gain.gain.value=.08;osc.frequency.value=660;osc.start();osc.stop(ctx.currentTime+.25);osc.onended=()=>ctx.close()}catch{toast('当前浏览器无法播放提示音')}}
function triggerDemo(){const t=today().find(x=>x.status==='pending');if(!t){toast('先添加一个待确认的用药安排');return}if(role==='relative'){toast('已切换老人端展示提醒');role='elder';page='today';render()}showReminder(t)}function simulateOverdue(){const t=today().find(x=>x.status==='pending');if(!t){toast('没有待确认的任务');return}t.forcedOverdue=true;save();render();toast('已模拟超时，亲属端可查看')}
function resetDemo(){if(!confirm('清除当前演示数据并恢复示例？'))return;db=seed();shown.clear();save();closeDialog('reminder');render();toast('演示数据已重置')}
window.addEventListener('storage',e=>{if(e.key!==KEY)return;db=read();const t=db.tasks.find(x=>x.id===activeReminder);if(activeReminder&&(!t||t.status!=='pending'))closeDialog('reminder');render();toast('另一标签页的更改已同步')});
setInterval(()=>{if(dateKey()!==today()[0]?.date||page==='today')render();if(role!=='elder'||$('editor').open||$('reminder').open)return;const tasks=pendingGroup();if(!tasks.length)return;const t=tasks[0],due=tasks.every(x=>x.snoozeUntil?Date.now()>=x.snoozeUntil:Date.now()>=new Date(x.date+'T'+x.time+':00+08:00').getTime());const key=t.date+':'+t.time+':'+Math.max(...tasks.map(x=>x.snoozeUntil||0));if(due&&!shown.has(key)){shown.add(key);showReminder(t)}},15000);
render();
</script>
</body></html>
